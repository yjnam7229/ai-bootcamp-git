services:
  db:
    image: mysql:8.0
    container_name: myproject-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin1234
      MYSQL_DATABASE: my_memo_app
    volumes:
      - db-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  backend:
    image: ghcr.io/yjnam7229/my-memo-app:1.0.0
    container_name: myproject-backend
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://root:admin1234@db:3306/my_memo_app

volumes:
  db-data: