version: '3.0'

services:
  db:
    image: mysql:8.0
    container_name: myproject-db
    environment:
      - MYSQL_ROOT_PASSWORD=admin1234
      - MYSQL_DATABASE=my_memo_app
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myproject-backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:admin1234@db:3306/my_memo_app
    volumes:
      - ./backend:/app
    # command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
  db-data:
