<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>confirm</title>
</head>
<body>
	<!-- 확인 창 만들기 -->
	<script>		
	  let reply = confirm('정말 배경 이미지를 바꾸시겠습니까?');
	  if(reply) {
		alert('정상적으로 처리되었습니다.')
	  }else{
		alert('취소되었습니다.')
	  }
	</script>
</body>
</html>
