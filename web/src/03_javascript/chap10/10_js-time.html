<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>What time is it?</title>
	<style>
		body {
			font-size:2em;
			text-align: center;
		}
	</style>
</head>
<body>
	<script>
		// 주석문 기호 1
		/* 주석문 기호 2*/
		let now = new Date(); // 객체 생성
		let display = now.toLocaleTimeString();
		document.write("현재 시각은 " + display);	
		
	</script>
</body>
</html>
