<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>letter-spacing</title>
    <style>  
      p {
        font-size:80px;
      }
      /* 글자 간격 조절하기 */
      .spacing1 {
          /* 글자 간격 0.2em */
          letter-spacing: 0.2em;
      }
      .spacing2 {
          /* 글자 간격 0.5em */
          letter-spacing: 0.5em;
      }      
    </style>
  </head>
  <body>
    <p>CSS</p> 
    <p class="spacing1">CSS</p>
    <p class="spacing2">CSS</p>
  </body>
</html>
