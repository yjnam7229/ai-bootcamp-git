<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>text-shadow</title>
  <style>    
    h1 { 
      font-size:60px;
    } 
    /* text-shadow 속성으로 텍스트 그림자 추가하기 */
    .shadow1 {
      color:red;
      
    }
    .shadow2 {
      /* text-shadow: 5px 5px 3px #ffa500; */
      text-shadow: 2px 3px 4px #05f822;
    }
    .shadow3 {
      color:#fff;
      
    }
  </style>
</head>
<body>
  <h1 class="shadow1">HTML</h1> 
  <h1 class="shadow2">CSS</h1>
  <h1 class="shadow3">자바스크립트</h1>
</body>
</html>
