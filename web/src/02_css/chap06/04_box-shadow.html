<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>박스모델</title>
	<style>    	
		button {
			font-size: 2em;
			background: #fff;
      		padding: 15px 30px;
			margin:15px;				
      		border: 1px solid #222;	
			box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);   /* 박스 모델에 그림자 추가하기 */
      		cursor: pointer;		/* 오른쪽 아래에 그림자 효과*/
		}	
	</style>
</head>
<body>
	<button>Do it!</button>
</body>
</html>
